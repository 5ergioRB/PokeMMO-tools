<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booty's 29.3k Cobblestone Farm — Material List</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --dirt: #866043;
    --grass: #5d9e2f;
    --stone: #8b8b8b;
    --wood: #a07840;
    --gold: #f5c542;
    --red: #c0392b;
    --dark: #1a1a1a;
    --panel: #2a2a2a;
    --border-light: #555;
    --border-gold: #8a7020;
    --text: #e8e8e8;
    --muted: #aaa;
    --slot-bg: #313131;
    --slot-border: #1a1a1a;
    --slot-inner: #8b8b8b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #1a1a1a;
    background-image: url('https://i.imgur.com/YaMYJSL.png');
    background-repeat: repeat;
    background-size: 128px;
    image-rendering: pixelated;
    font-family: 'VT323', monospace;
    color: var(--text);
    min-height: 100vh;
  }

  /* Dirt overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(10,8,6,0.75);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* ─── HEADER ─── */
  .header {
    text-align: center;
    padding: 40px 20px 30px;
  }

  .header-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 16px;
  }

  .header-logo img {
    width: 56px;
    height: 56px;
    image-rendering: pixelated;
  }

  .site-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(13px, 2.5vw, 20px);
    color: var(--gold);
    text-shadow: 3px 3px 0 #7a6010, -1px -1px 0 #000;
    line-height: 1.5;
    letter-spacing: 1px;
  }

  .site-subtitle {
    font-size: 22px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 2px;
  }

  .header-date {
    font-size: 18px;
    color: #888;
    margin-top: 4px;
  }

  /* ─── MC PANEL ─── */
  .mc-panel {
    background: #3c3c3c;
    border: 3px solid #111;
    box-shadow: inset 2px 2px 0 #666, inset -2px -2px 0 #111, 0 4px 20px rgba(0,0,0,0.8);
    border-radius: 0;
    padding: 16px;
    margin-bottom: 20px;
  }

  .mc-panel-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--gold);
    text-shadow: 2px 2px 0 #7a6010;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid #222;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mc-panel-title img {
    width: 24px;
    height: 24px;
    image-rendering: pixelated;
  }

  /* ─── STATS ─── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: #2a2a2a;
    border: 2px solid #111;
    box-shadow: inset 1px 1px 0 #555, inset -1px -1px 0 #111;
    padding: 14px 12px;
    text-align: center;
  }

  .stat-icon {
    width: 32px;
    height: 32px;
    image-rendering: pixelated;
    margin: 0 auto 8px;
    display: block;
  }

  .stat-num {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    color: var(--gold);
    text-shadow: 2px 2px 0 #7a6010;
    display: block;
  }

  .stat-label {
    font-size: 16px;
    color: var(--muted);
    display: block;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* ─── FILTERS ─── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .filter-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 8px 12px;
    background: #3a3a3a;
    border: 2px solid #111;
    box-shadow: inset 1px 1px 0 #666, inset -1px -1px 0 #111;
    color: #ccc;
    cursor: pointer;
    transition: none;
    letter-spacing: 0.5px;
  }

  .filter-btn:hover, .filter-btn.active {
    background: #5a7a2a;
    color: #fff;
    box-shadow: inset 1px 1px 0 #8aba3a, inset -1px -1px 0 #2a4a10;
    border-color: #1a1a1a;
  }

  .filter-btn.active {
    background: #4a6a1e;
  }

  /* ─── SEARCH ─── */
  .search-wrap {
    position: relative;
    margin-bottom: 20px;
  }

  .search-input {
    font-family: 'VT323', monospace;
    font-size: 20px;
    width: 100%;
    background: #1e1e1e;
    border: 2px solid #111;
    box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 #555;
    color: var(--text);
    padding: 10px 14px 10px 44px;
    outline: none;
    letter-spacing: 1px;
  }

  .search-input:focus {
    border-color: #8aba3a;
    box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 #555, 0 0 0 2px rgba(138,186,58,0.3);
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    image-rendering: pixelated;
  }

  /* ─── ITEMS GRID ─── */
  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 4px;
  }

  .category-header {
    grid-column: 1 / -1;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #888;
    padding: 16px 4px 6px;
    border-bottom: 1px solid #333;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .category-header img {
    width: 16px;
    height: 16px;
    image-rendering: pixelated;
  }

  .item-card {
    background: #3a3a3a;
    border: 2px solid #111;
    box-shadow: inset 1px 1px 0 #666, inset -2px -2px 0 #111;
    padding: 12px 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: default;
    transition: background 0.1s;
    position: relative;
    overflow: hidden;
  }

  .item-card:hover {
    background: #484848;
    box-shadow: inset 1px 1px 0 #888, inset -2px -2px 0 #111;
  }

  .item-card.hidden { display: none; }

  .item-slot {
    width: 64px;
    height: 64px;
    background: #313131;
    border: 2px solid #111;
    box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 #777;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .item-slot img {
    width: 48px;
    height: 48px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .item-count-badge {
    position: absolute;
    bottom: 2px;
    right: 3px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #fff;
    text-shadow: 1px 1px 0 #000, -1px 0 0 #000, 0 -1px 0 #000;
    line-height: 1;
  }

  .item-name {
    font-size: 16px;
    color: #ddd;
    text-align: center;
    line-height: 1.3;
    letter-spacing: 0.5px;
    text-transform: capitalize;
  }

  .item-qty {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--gold);
    text-shadow: 1px 1px 0 #7a6010;
  }

  .item-stacks {
    font-size: 13px;
    color: #777;
    letter-spacing: 0.5px;
  }

  .item-tag {
    position: absolute;
    top: 4px;
    left: 4px;
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    background: #5a2020;
    color: #ff6060;
    border: 1px solid #3a1010;
    padding: 2px 4px;
    line-height: 1;
  }

  /* ─── TOOLTIP ─── */
  .tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    display: none;
    background: #100010;
    border: 2px solid #5a2080;
    box-shadow: inset 1px 1px 0 #8040c0, 2px 2px 8px rgba(0,0,0,0.9);
    padding: 8px 12px;
    min-width: 180px;
  }

  .tooltip.visible { display: block; }

  .tooltip-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #fff;
    margin-bottom: 6px;
  }

  .tooltip-row {
    font-size: 15px;
    color: #aaa;
    line-height: 1.6;
  }

  .tooltip-row span { color: #55ff55; }

  /* ─── PROGRESS BAR SECTION ─── */
  .checklist-area {
    margin-top: 8px;
  }

  .progress-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 4px;
    border-bottom: 1px solid #2a2a2a;
    cursor: pointer;
  }

  .progress-item:hover { background: #333; }

  .progress-item img {
    width: 28px;
    height: 28px;
    image-rendering: pixelated;
    flex-shrink: 0;
  }

  .progress-name {
    font-size: 17px;
    color: #ccc;
    flex: 1;
    text-transform: capitalize;
    letter-spacing: 0.5px;
  }

  .progress-bar-wrap {
    width: 100px;
    height: 10px;
    background: #1a1a1a;
    border: 1px solid #111;
    flex-shrink: 0;
  }

  .progress-bar-fill {
    height: 100%;
    background: #5a9e20;
    transition: width 0.3s;
  }

  .progress-count {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--gold);
    min-width: 36px;
    text-align: right;
    flex-shrink: 0;
  }

  .gathered-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 4px 6px;
    background: #2a2a2a;
    border: 1px solid #555;
    color: #888;
    cursor: pointer;
    flex-shrink: 0;
  }

  .gathered-btn.done {
    background: #2a5a10;
    border-color: #5a9e20;
    color: #8ade30;
  }

  .progress-item.gathered .progress-name { color: #5a9e20; text-decoration: line-through; }
  .progress-item.gathered .progress-bar-fill { background: #3a7e10; }

  /* ─── FOOTER ─── */
  .footer {
    text-align: center;
    padding-top: 30px;
    font-size: 14px;
    color: #444;
    letter-spacing: 1px;
  }

  /* ─── TABS ─── */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 0;
  }

  .tab-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 10px 16px;
    background: #2e2e2e;
    border: 2px solid #111;
    border-bottom: none;
    color: #888;
    cursor: pointer;
    letter-spacing: 0.5px;
  }

  .tab-btn.active {
    background: #3c3c3c;
    color: var(--gold);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #1a1a1a; }
  ::-webkit-scrollbar-thumb { background: #555; }

  @media (max-width: 500px) {
    .items-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .site-title { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="header-logo">
      <img src="https://minecraft.wiki/images/Cobblestone_JE2_BE2.png" alt="cobblestone" onerror="this.src='https://wiki.vg/images/thumb/0/04/Cobblestone.png/150px-Cobblestone.png'">
      <div>
        <div class="site-title">MATERIAL LIST</div>
        <div class="site-subtitle">Booty's 29.3k Cobblestone Farm with Storage</div>
        <div class="header-date">Generated: Wed, 18 Mar 2026</div>
      </div>
      <img src="https://minecraft.wiki/images/Cobblestone_JE2_BE2.png" alt="cobblestone">
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-grid" id="stats-grid"></div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('grid')">&#9783; Item Grid</button>
    <button class="tab-btn" onclick="switchTab('list')">&#9776; Checklist</button>
  </div>

  <!-- GRID TAB -->
  <div id="tab-grid" class="tab-content active">
    <div class="mc-panel">
      <div class="mc-panel-title">
        <img src="https://minecraft.wiki/images/Crafting_Table_JE4_BE3.png" alt="">
        MATERIALS
      </div>

      <!-- SEARCH -->
      <div class="search-wrap">
        <img class="search-icon" src="https://minecraft.wiki/images/Spyglass_JE2_BE1.png" alt="" onerror="this.style.display='none'">
        <input class="search-input" type="text" id="search" placeholder="Search items..." oninput="applySearch()">
      </div>

      <!-- FILTERS -->
      <div class="filters" id="filters"></div>

      <!-- GRID -->
      <div class="items-grid" id="items-grid"></div>
    </div>
  </div>

  <!-- CHECKLIST TAB -->
  <div id="tab-list" class="tab-content">
    <div class="mc-panel">
      <div class="mc-panel-title">
        <img src="https://minecraft.wiki/images/Book_JE2_BE2.png" alt="">
        GATHERING CHECKLIST
      </div>
      <div class="checklist-area" id="checklist"></div>
    </div>
  </div>

  <div class="footer">
    &gt; MINECRAFT MATERIAL PLANNER &lt; &nbsp;|&nbsp; ALL 26 ITEMS NEEDED
  </div>
</div>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip">
  <div class="tooltip-name" id="tt-name"></div>
  <div class="tooltip-row">Total: <span id="tt-total"></span></div>
  <div class="tooltip-row">Stacks: <span id="tt-stacks"></span></div>
  <div class="tooltip-row">Leftover: <span id="tt-left"></span></div>
  <div class="tooltip-row">Category: <span id="tt-cat"></span></div>
</div>

<script>
const materials = [
  { item: "minecraft:smooth_stone", total: 30 },
  { item: "minecraft:hopper", total: 21 },
  { item: "minecraft:cobblestone", total: 12 },
  { item: "minecraft:water_bucket", total: 11 },
  { item: "minecraft:redstone", total: 10 },
  { item: "minecraft:chest", total: 8 },
  { item: "minecraft:oak_leaves", total: 8 },
  { item: "minecraft:piston", total: 5 },
  { item: "minecraft:observer", total: 4 },
  { item: "minecraft:redstone_torch", total: 4 },
  { item: "minecraft:barrel", total: 3 },
  { item: "minecraft:oak_sign", total: 3 },
  { item: "minecraft:dispenser", total: 2 },
  { item: "minecraft:dropper", total: 2 },
  { item: "minecraft:lava_bucket", total: 2 },
  { item: "minecraft:comparator", total: 2 },
  { item: "minecraft:shulker_box", total: 2 },
  { item: "minecraft:spruce_trapdoor", total: 2 },
  { item: "minecraft:flowering_azalea_leaves", total: 1 },
  { item: "minecraft:lever", total: 1 },
  { item: "minecraft:note_block", total: 1 },
  { item: "minecraft:oak_fence_gate", total: 1 },
  { item: "minecraft:stone_brick_slab", total: 1 },
  { item: "minecraft:stone_brick_stairs", total: 1 },
  { item: "minecraft:stone_brick_wall", total: 1 },
  { item: "minecraft:tnt", total: 1 }
];

const categories = {
  "Redstone": ["minecraft:redstone","minecraft:observer","minecraft:redstone_torch","minecraft:piston","minecraft:comparator","minecraft:dispenser","minecraft:dropper","minecraft:hopper","minecraft:note_block","minecraft:lever"],
  "Blocks": ["minecraft:smooth_stone","minecraft:cobblestone","minecraft:chest","minecraft:barrel","minecraft:stone_brick_slab","minecraft:stone_brick_stairs","minecraft:stone_brick_wall","minecraft:shulker_box"],
  "Natural": ["minecraft:oak_leaves","minecraft:flowering_azalea_leaves"],
  "Liquids": ["minecraft:water_bucket","minecraft:lava_bucket"],
  "Wood & Misc": ["minecraft:oak_sign","minecraft:spruce_trapdoor","minecraft:oak_fence_gate","minecraft:tnt"]
};

const catIcons = {
  "Redstone": "https://minecraft.wiki/images/Redstone_Dust_JE2_BE2.png",
  "Blocks": "https://minecraft.wiki/images/Stone_JE5.png",
  "Natural": "https://minecraft.wiki/images/Oak_Leaves_JE6_BE4.png",
  "Liquids": "https://minecraft.wiki/images/Water_Bucket_JE2_BE2.png",
  "Wood & Misc": "https://minecraft.wiki/images/Oak_Log_JE4_BE2.png"
};

// Map item name → wiki image URL
const textureMap = {
  "minecraft:smooth_stone": "Smooth_Stone_JE2_BE1",
  "minecraft:hopper": "Hopper_(item)_JE2",
  "minecraft:cobblestone": "Cobblestone_JE2_BE2",
  "minecraft:water_bucket": "Water_Bucket_JE2_BE2",
  "minecraft:redstone": "Redstone_Dust_JE2_BE2",
  "minecraft:chest": "Chest_(item)_JE3",
  "minecraft:oak_leaves": "Oak_Leaves_JE6_BE4",
  "minecraft:piston": "Piston_(item)_JE2",
  "minecraft:observer": "Observer_(item)_JE3_BE3",
  "minecraft:redstone_torch": "Redstone_Torch_JE2_BE2",
  "minecraft:barrel": "Barrel_(item)_JE2_BE2",
  "minecraft:oak_sign": "Oak_Sign_JE3",
  "minecraft:dispenser": "Dispenser_(item)_JE2_BE2",
  "minecraft:dropper": "Dropper_(item)_JE2_BE2",
  "minecraft:lava_bucket": "Lava_Bucket_JE3_BE3",
  "minecraft:comparator": "Redstone_Comparator_(item)_JE4_BE3",
  "minecraft:shulker_box": "Purple_Shulker_Box_JE3",
  "minecraft:spruce_trapdoor": "Spruce_Trapdoor_JE4_BE2",
  "minecraft:flowering_azalea_leaves": "Flowering_Azalea_Leaves_JE1_BE1",
  "minecraft:lever": "Lever_JE3",
  "minecraft:note_block": "Note_Block_JE2_BE2",
  "minecraft:oak_fence_gate": "Oak_Fence_Gate_(item)_JE4",
  "minecraft:stone_brick_slab": "Stone_Brick_Slab_JE5",
  "minecraft:stone_brick_stairs": "Stone_Brick_Stairs_JE5",
  "minecraft:stone_brick_wall": "Cobblestone_Wall_(item)_JE3",
  "minecraft:tnt": "TNT_JE2_BE2"
};

function getTexture(item) {
  const key = textureMap[item];
  if (!key) return "";
  return `https://minecraft.wiki/images/${key}.png`;
}

const catForItem = {};
Object.entries(categories).forEach(([cat, items]) => items.forEach(i => catForItem[i] = cat));

const prettyName = s => s.replace("minecraft:","").replace(/_/g," ");
const stackStr = n => {
  const s = Math.floor(n/64), r = n%64;
  if (s === 0) return `${r} items`;
  return s + " stack" + (s>1?"s":"") + (r>0?` + ${r}`:"");
};

let activeFilter = "All";
let gathered = new Set();

// ─── STATS ───
function renderStats() {
  const total = materials.reduce((a,m)=>a+m.total,0);
  const stacks = Math.floor(total/64);
  const statsEl = document.getElementById("stats-grid");
  const statsData = [
    { icon: "https://minecraft.wiki/images/Crafting_Table_JE4_BE3.png", num: materials.length, label: "Item Types" },
    { icon: "https://minecraft.wiki/images/Cobblestone_JE2_BE2.png", num: total, label: "Total Blocks" },
    { icon: "https://minecraft.wiki/images/Chest_(item)_JE3.png", num: stacks, label: "Full Stacks" },
    { icon: "https://minecraft.wiki/images/Book_JE2_BE2.png", num: total%64, label: "Leftover Items" }
  ];
  statsEl.innerHTML = statsData.map(s => `
    <div class="stat-card">
      <img class="stat-icon" src="${s.icon}" alt="">
      <span class="stat-num">${s.num}</span>
      <span class="stat-label">${s.label}</span>
    </div>
  `).join("");
}

// ─── FILTERS ───
function renderFilters() {
  const cats = ["All", ...Object.keys(categories)];
  document.getElementById("filters").innerHTML = cats.map(c =>
    `<button class="filter-btn${c===activeFilter?' active':''}" onclick="setFilter('${c}')">${c}</button>`
  ).join("");
}

function setFilter(cat) {
  activeFilter = cat;
  renderFilters();
  renderGrid();
}
window.setFilter = setFilter;

// ─── GRID ───
function renderGrid() {
  const search = (document.getElementById("search")?.value||"").toLowerCase();
  const grid = document.getElementById("items-grid");

  const filtered = materials.filter(m => {
    const matchCat = activeFilter === "All" || catForItem[m.item] === activeFilter;
    const matchSearch = !search || prettyName(m.item).toLowerCase().includes(search);
    return matchCat && matchSearch;
  });

  if (activeFilter === "All" && !search) {
    let html = "";
    Object.entries(categories).forEach(([cat, catItems]) => {
      const items = catItems.map(i => materials.find(m => m.item === i)).filter(Boolean);
      if (!items.length) return;
      html += `<div class="category-header"><img src="${catIcons[cat]||''}" alt="">${cat.toUpperCase()}</div>`;
      items.forEach(m => { html += cardHTML(m); });
    });
    grid.innerHTML = html;
  } else {
    grid.innerHTML = filtered.map(m => cardHTML(m)).join("");
  }
}

function cardHTML(m) {
  const tex = getTexture(m.item);
  const isLarge = m.total >= 10;
  return `
    <div class="item-card" 
      onmouseenter="showTooltip(event,'${m.item}',${m.total})"
      onmouseleave="hideTooltip()"
      onmousemove="moveTooltip(event)">
      ${isLarge ? '<div class="item-tag">MANY</div>' : ''}
      <div class="item-slot">
        <img src="${tex}" alt="${prettyName(m.item)}" onerror="this.style.opacity=0.3">
        <div class="item-count-badge">${m.total}</div>
      </div>
      <div class="item-name">${prettyName(m.item)}</div>
      <div class="item-qty">${m.total}x</div>
      <div class="item-stacks">${stackStr(m.total)}</div>
    </div>`;
}

function applySearch() { renderGrid(); }
window.applySearch = applySearch;

// ─── CHECKLIST ───
function renderChecklist() {
  const maxTotal = Math.max(...materials.map(m=>m.total));
  document.getElementById("checklist").innerHTML = materials.map((m,i) => {
    const tex = getTexture(m.item);
    const pct = (m.total/maxTotal*100).toFixed(0);
    const done = gathered.has(m.item);
    return `
      <div class="progress-item${done?' gathered':''}" id="pi_${i}">
        <img src="${tex}" alt="" onerror="this.style.opacity=0.2">
        <div class="progress-name">${prettyName(m.item)}</div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width:${pct}%"></div>
        </div>
        <div class="progress-count">${m.total}</div>
        <button class="gathered-btn${done?' done':''}" onclick="toggleGather('${m.item}',${i})">${done?'✓ GOT':'NEED'}</button>
      </div>`;
  }).join("");
}

function toggleGather(item, i) {
  if (gathered.has(item)) gathered.delete(item);
  else gathered.add(item);
  renderChecklist();
}
window.toggleGather = toggleGather;

// ─── TABS ───
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['grid','list'][i]===name));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}
window.switchTab = switchTab;

// ─── TOOLTIP ───
function showTooltip(e, item, total) {
  const tt = document.getElementById("tooltip");
  document.getElementById("tt-name").textContent = prettyName(item).toUpperCase();
  document.getElementById("tt-total").textContent = total;
  document.getElementById("tt-stacks").textContent = Math.floor(total/64);
  document.getElementById("tt-left").textContent = total%64;
  document.getElementById("tt-cat").textContent = catForItem[item]||"misc";
  tt.classList.add("visible");
  moveTooltip(e);
}
function moveTooltip(e) {
  const tt = document.getElementById("tooltip");
  tt.style.left = (e.clientX+16)+"px";
  tt.style.top = (e.clientY+10)+"px";
}
function hideTooltip() {
  document.getElementById("tooltip").classList.remove("visible");
}
window.showTooltip = showTooltip;
window.moveTooltip = moveTooltip;
window.hideTooltip = hideTooltip;

// ─── INIT ───
renderStats();
renderFilters();
renderGrid();
renderChecklist();
</script>
</body>
</html>
